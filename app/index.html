<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedro</title>
<link rel="stylesheet" href="style.css">
<script>try { if (JSON.parse(localStorage.getItem('pedro.theme')) === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
</head>
<body>
<script>if (/[?&]mini=1/.test(location.search)) document.body.classList.add('mini');</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#ffffff"/><rect width="5" height="12" fill="#0d0d0d"/></pattern>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4c0 .8.9 1.3 1.6.9l11-7.2c.6-.4.6-1.4 0-1.8l-11-7.2c-.7-.4-1.6.1-1.6.9Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.4" fill="currentColor"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 6v12c0 .8-.9 1.3-1.6.8L9.5 13.6a2 2 0 0 1 0-3.2l7.9-5.2c.7-.5 1.6 0 1.6.8Z" fill="currentColor"/><rect x="4.6" y="5" width="3.2" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6v12c0 .8.9 1.3 1.6.8l7.9-5.2a2 2 0 0 0 0-3.2L6.6 5.2C5.9 4.7 5 5.2 5 6Z" fill="currentColor"/><rect x="16.2" y="5" width="3.2" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.1 1 4.2 2.7l2.6 4.6C14.4 16 15.5 17 17.5 17H21"/><path d="M3 17h3.5c1.6 0 2.6-.6 3.4-1.7M14.1 8.7C15 7.6 16 7 17.5 7H21"/><path d="m18 4 3 3-3 3M18 14l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20"/><path d="m17 3 3 3-3 3"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/><path d="m7 21-3-3 3-3"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.3a8 8 0 0 1 0 11.4"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15.2 15.2 4.8 4.8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 12.5h12"/></symbol>
    <symbol id="i-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><rect x="11" y="11.5" width="7" height="5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9.5 4.5V3.8c0-.7.5-1.3 1.2-1.3h2.6c.7 0 1.2.6 1.2 1.3v.7"/><path d="M9.5 11h5M9.5 15h3"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 18.5H7a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 17.8 8a5.3 5.3 0 0 1-.3 10.5Z" fill="currentColor"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M12 6.2a5.8 5.8 0 0 0-5.8 5.8" stroke-linecap="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M19 10v8" /><circle cx="17" cy="18" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3 4.4 13a4.9 4.9 0 0 1 6.9-7l.7.7.7-.7a4.9 4.9 0 0 1 6.9 7Z" fill="currentColor"/></symbol>
    <symbol id="i-feed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12h2.5l2.5-6 4 13 3-9 1.5 2H20"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8" fill="currentColor"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <svg class="shape sh-circle" viewBox="0 0 200 200"><g class="spin"><circle cx="100" cy="100" r="88" fill="url(#hatch)" stroke="#0d0d0d" stroke-width="7"/></g></svg>
  <svg class="shape sh-star" viewBox="0 0 200 200"><g class="spin"><path d="M100.0 8.0 L116.0 40.1 L146.0 20.3 L143.8 56.2 L179.7 54.0 L159.9 84.0 L192.0 100.0 L159.9 116.0 L179.7 146.0 L143.8 143.8 L146.0 179.7 L116.0 159.9 L100.0 192.0 L84.0 159.9 L54.0 179.7 L56.2 143.8 L20.3 146.0 L40.1 116.0 L8.0 100.0 L40.1 84.0 L20.3 54.0 L56.2 56.2 L54.0 20.3 L84.0 40.1Z" fill="#ffffff" stroke="#0d0d0d" stroke-width="7" stroke-linejoin="round"/><circle cx="100" cy="100" r="22" fill="#0d0d0d"/></g></svg>
  <svg class="shape sh-square" viewBox="0 0 200 200"><rect x="12" y="12" width="176" height="176" rx="28" fill="#0d0d0d"/><rect x="44" y="44" width="112" height="112" rx="14" fill="none" stroke="#ffffff" stroke-width="8"/></svg>
  <svg class="shape sh-zigzag" viewBox="0 0 400 80"><path d="M14 62 L64 18 L114 62 L164 18 L214 62 L264 18 L314 62 L364 18" fill="none" stroke="#0d0d0d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="shape sh-pill" viewBox="0 0 120 260"><rect x="8" y="8" width="104" height="244" rx="52" fill="#ffffff" stroke="#0d0d0d" stroke-width="7"/><path d="M8 130h104" stroke="#0d0d0d" stroke-width="7"/><rect x="8" y="130" width="104" height="122" rx="0" fill="url(#hatch)"/><rect x="8" y="8" width="104" height="244" rx="52" fill="none" stroke="#0d0d0d" stroke-width="7"/></svg>
  <svg class="shape sh-plus p1" viewBox="0 0 40 40"><path d="M20 5v30M5 20h30" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/></svg>
  <svg class="shape sh-plus p2" viewBox="0 0 40 40"><path d="M20 5v30M5 20h30" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/></svg>
  <svg class="shape sh-plus p3" viewBox="0 0 40 40"><path d="M20 5v30M5 20h30" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/></svg>
  <svg class="shape sh-plus p4" viewBox="0 0 40 40"><path d="M20 5v30M5 20h30" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/></svg>
  <div class="bg-grain"></div>
</div>

<header class="titlebar" data-drag>
  <div class="brand"><span class="brand-mark"><svg><use href="#i-play"/></svg></span><span class="brand-name">PEDRO</span></div>
  <div class="tb-actions">
    <button class="tb-btn" id="btnSettings" title="Настройки"><svg><use href="#i-gear"/></svg></button>
    <button class="tb-btn" id="btnMini" title="Мини-плеер"><svg><use href="#i-mini"/></svg></button>
    <button class="tb-btn" id="btnMin" title="Свернуть в трей"><svg><use href="#i-min"/></svg></button>
    <button class="tb-btn close" id="btnClose" title="Закрыть"><svg><use href="#i-x"/></svg></button>
  </div>
</header>

<main class="layout" id="layout">
  <section class="card now glass" id="now">
    <button class="tb-btn expand" id="btnExpand" title="Развернуть"><svg><use href="#i-expand"/></svg></button>
    <div class="art-wrap">
      <div class="art empty" id="art">
        <img id="artImg" alt="" draggable="false">
        <div class="art-empty"><svg><use href="#i-disc"/></svg></div>
      </div>
      <span class="sticker" id="sticker">ГОТОВ</span>
    </div>
    <div class="meta">
      <h1 class="title" id="title">Ничего не играет</h1>
      <div class="artist-row">
        <span class="artist" id="artist">Вставь ссылку SoundCloud справа</span>
        <button class="sc-chip" id="scLink" title="Открыть на SoundCloud" hidden><svg><use href="#i-cloud"/></svg>SoundCloud</button>
        <button class="sc-chip add" id="btnAdd" title="Добавить в плейлист" hidden><svg><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="seek">
      <div class="bar" id="seek" role="slider" aria-label="Позиция"><div class="bar-fill" id="seekFill"></div><div class="bar-thumb" id="seekThumb"></div></div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="ctl sm" id="btnShuffle" title="Перемешать"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ctl md" id="btnPrev" title="Предыдущий"><svg><use href="#i-prev"/></svg></button>
      <button class="ctl play" id="btnPlay" title="Играть / пауза"><svg id="playIcon"><use href="#i-play"/></svg></button>
      <button class="ctl md" id="btnNext" title="Следующий"><svg><use href="#i-next"/></svg></button>
      <button class="ctl sm" id="btnRepeat" title="Повтор"><svg><use href="#i-repeat"/></svg><b class="badge">1</b></button>
    </div>
    <div class="volume">
      <button class="ctl xs" id="btnMute" title="Звук"><svg id="volIcon"><use href="#i-vol"/></svg></button>
      <div class="bar vol" id="vol" role="slider" aria-label="Громкость"><div class="bar-fill" id="volFill"></div><div class="bar-thumb" id="volThumb"></div></div>
    </div>
  </section>

  <section class="card side glass" id="side">
    <form class="omni" id="omni" autocomplete="off">
      <svg class="omni-icon"><use href="#i-search"/></svg>
      <input id="q" type="text" placeholder="Ссылка SoundCloud или поиск" spellcheck="false">
      <kbd>Enter</kbd>
    </form>
    <div class="clip" id="clip" hidden>
      <svg class="clip-icon"><use href="#i-clip"/></svg>
      <div class="clip-text"><small id="clipKind">Ссылка</small><span id="clipTitle">…</span></div>
      <div class="clip-acts" id="clipActs"></div>
      <button class="icon-btn" id="clipClose" title="Скрыть"><svg><use href="#i-x"/></svg></button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="queue" class="on">Очередь</button>
      <button data-tab="library">Библиотека</button>
      <button data-tab="profile">Профиль</button>
    </nav>
    <div class="list-head" id="listHead"></div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="modal" id="settings" hidden>
  <div class="sheet glass" role="dialog" aria-labelledby="setTitle">
    <h2 id="setTitle">Настройки</h2>
    <div class="pref-row"><span>Обложка прыгает</span><div class="tabs seg">
      <button data-pref="beat" data-val="off">Выкл</button><button data-pref="beat" data-val="soft">Мягко</button><button data-pref="beat" data-val="strong">Сильно</button></div></div>
    <div class="pref-row"><span>Тема</span><div class="tabs seg">
      <button data-pref="theme" data-val="light">Светлая</button><button data-pref="theme" data-val="dark">Тёмная</button></div></div>
    <label class="switch-row">
      <span><b>Анимация фона</b><small>Фигуры на фоне медленно плавают и крутятся. Выключи, если хочется полной тишины.</small></span>
      <input type="checkbox" id="bgAnim"><i class="switch"></i>
    </label>
    <label class="switch-row">
      <span><b>Цвет от обложки</b><small>Кнопка, прогресс и играющий трек красятся в главный цвет обложки, обложка становится цветной.</small></span>
      <input type="checkbox" id="accentMode"><i class="switch"></i>
    </label>
    <label class="switch-row">
      <span><b>Сворачивать в трей</b><small>✕ и — прячут Pedro к часам, музыка играет дальше. Выход: правый клик по значку.</small></span>
      <input type="checkbox" id="trayMode"><i class="switch"></i>
    </label>
    <label class="switch-row">
      <span><b>Поверх всех окон</b><small>Большое окно не прячется за другими. Мини-плеер всегда сверху.</small></span>
      <input type="checkbox" id="onTop"><i class="switch"></i>
    </label>
    <div class="sheet-row">
      <span class="grow"></span>
      <button class="btn primary" id="setDone">Готово</button>
    </div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<div class="toast" id="toast" role="status"></div>

<iframe id="sc" class="sc-frame" title="SoundCloud" allow="autoplay; encrypted-media"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script src="app.js"></script>
</body>
</html>
